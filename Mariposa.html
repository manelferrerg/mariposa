<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariposa</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2068%2058%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cpath%20d%3D%22M32%2027C24%2010%2012%202%205%205S0%2022%208%2028s17%203%2024-1z%22%20fill%3D%22%23D0417E%22/%3E%3Cpath%20d%3D%22M32%2031c-9-1-19%203-20%2012s7%2012%2012%208%208-12%208-20z%22%20fill%3D%22%2392b558%22/%3E%3Cpath%20d%3D%22M27%2024C21%2014%2013%208%209%2010s-2%2011%204%2014%2010%202%2014%200z%22%20fill%3D%22%23fff%22%20opacity%3D%22.18%22/%3E%3Cg%20transform%3D%22matrix%28-1%200%200%201%2068%200%29%22%3E%3Cpath%20d%3D%22M32%2027C24%2010%2012%202%205%205S0%2022%208%2028s17%203%2024-1z%22%20fill%3D%22%23f87c56%22/%3E%3Cpath%20d%3D%22M32%2031c-9-1-19%203-20%2012s7%2012%2012%208%208-12%208-20z%22%20fill%3D%22%2392b558%22/%3E%3Cpath%20d%3D%22M27%2024C21%2014%2013%208%209%2010s-2%2011%204%2014%2010%202%2014%200z%22%20fill%3D%22%23fff%22%20opacity%3D%22.22%22/%3E%3C/g%3E%3Crect%20x%3D%2232%22%20y%3D%2217%22%20width%3D%224%22%20height%3D%2230%22%20rx%3D%222%22%20fill%3D%22%23111%22/%3E%3Cpath%20d%3D%22M33%2018c-1-6-4-10-8-12M35%2018c1-6%204-10%208-12%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mariposa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, personal, unhurried: a private planner for a new chapter.
   IDEA: an open butterfly: two wings are the two pages (Ítems | Semana), joined by a slim body.
   PICTURE: the working board itself, with a small butterfly mark beside the title.
   COLOUR and TYPE: user palette: black ink, Viva Magenta #D0417E (left wing, links), Peach Fuzz #f87c56 (right wing, today), Greenery #92b558 (done); Fraunces + Figtree.
   LAYOUT: header, then the two wings side by side; on phones a Semana / Ítems switch shows one wing at a time. */
:root{color-scheme:light dark;--mag:#D0417E;--acc:#f87c56;--grn:#92b558;
--bg:light-dark(#ffffff,#0f0f10);--ink:light-dark(#111111,#f3f3f3);--soft:light-dark(#5f5f66,#a7a7ad);
--wing:light-dark(#fcebf2,#25141c);--tint:light-dark(#fff1eb,#261811);--card:light-dark(#ffffff,#1b1b1e);
--line:light-dark(#ece2e6,#34303a);--chip:light-dark(#fbe3ee,#3a1b29);--vio:light-dark(#b3336a,#ec7aa7);
--accbg:light-dark(#ffeee6,#3a2015);
--ok:light-dark(#4a7224,#b3d488);--okbg:light-dark(#eef5e5,#1f2a14);
--mid:light-dark(#b4461f,#fb9c7e);--midbg:light-dark(#ffeee6,#3a2015);
--no:light-dark(#b3336a,#ec7aa7);--nobg:light-dark(#fbe6ef,#341824)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px;border-radius:8px}
svg{display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:clamp(20px,3vw,36px) max(4vw,16px) 20px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:68px;height:58px;flex:none}
.ttl{display:flex;align-items:center;gap:8px}
.luck{width:36px;height:36px;flex:none;border-radius:12px;padding:1px;transition:transform .25s ease}
.luck svg{width:100%;height:100%}
.luck:hover{transform:rotate(-8deg) scale(1.06)}
.luck:active{transform:scale(.94)}
#dSuerte{width:min(440px,calc(100vw - 20px))}
.sue{display:grid;justify-items:center;text-align:center;gap:14px;padding:4px 6px 6px}
.sue svg{width:120px;height:120px}
.sue p{margin:0;font:500 19px/1.45 Fraunces,Georgia,serif}
.sue p.sm{font:400 14px/1.5 Figtree,system-ui,sans-serif;color:var(--soft)}
h1{font:600 clamp(34px,5vw,48px)/1.05 Fraunces,Georgia,serif;margin:0}
.wk{margin:4px 0 0;color:var(--soft)}
.status{margin:0;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grn)}
.status.busy::before{background:var(--soft)}.status.warn::before{background:var(--acc)}
.switch,.hm{display:none}
.board{display:grid;grid-template-columns:minmax(0,.85fr) 6px minmax(0,1.3fr);gap:0 14px;max-width:1320px;margin:0 auto;padding:0 max(4vw,16px) 56px;align-items:start}
.spine{align-self:start;position:sticky;top:60px;height:min(46vh,360px);margin-top:60px;border-radius:3px;background:var(--ink)}
@media (min-width:761px){.right{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain}}
.wing{border-radius:28px;padding:clamp(14px,2vw,24px)}
.left{background:var(--wing)}.right{background:var(--tint)}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;margin:0 4px 14px}
h2{font:600 22px/1.2 Fraunces,Georgia,serif;margin:0}
.whead p,.note{margin:0;font-size:13px;color:var(--soft)}
.note .gi{display:inline-block;vertical-align:-4px;width:16px;height:16px}
.sec+.sec{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.sec>h2{margin:0 4px 4px}
.grp{margin-top:12px}
.gname{font-size:13px;font-weight:600;color:var(--soft);padding:4px;min-height:32px;text-align:left}
.gname:hover{color:var(--ink)}
.list{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 2px 4px 14px;min-height:50px;box-shadow:0 1px 2px light-dark(rgba(42,31,61,.06),rgba(0,0,0,.3))}
.txt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 0}
.t{text-align:left;font-weight:500;line-height:1.3;padding:2px 0}
.t:hover{color:var(--vio)}
.sub{font-size:13px;color:var(--soft);line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-top:4px}
.chip{font-size:13px;line-height:1;padding:7px 10px;border-radius:999px;background:var(--chip);color:var(--vio);font-weight:600}
.chip:hover{background:var(--vio);color:var(--card)}
.pill{font-size:13px;line-height:1;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 9px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.dchips{font-size:13px;color:var(--mid);font-weight:600;white-space:nowrap}
.ico{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--soft);flex:none}
.ico:hover{background:var(--wing);color:var(--ink)}
.ico svg{width:20px;height:20px}
.grip{width:30px;height:42px;display:grid;place-items:center;color:var(--soft);cursor:grab;touch-action:none;flex:none;opacity:.75}
.grip svg{width:18px;height:18px}
.row.done .t{text-decoration:line-through;color:var(--soft)}
.left .row.done{background:transparent;box-shadow:none;border-style:dashed}
.hint{font-size:13px;color:var(--soft);padding:12px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
.ph{min-height:50px;border:2px dashed var(--acc);border-radius:14px;background:var(--accbg);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mid);padding:4px 10px}
.list:has(.ph) .hint{display:none}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 14px 34px rgba(30,20,50,.28);transform:rotate(-1.5deg);background:var(--card)!important;border:1px solid var(--line)!important;border-radius:14px!important}
.dragging{opacity:.3}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}
.add{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--vio);padding:8px 6px;min-height:40px}
.add svg{width:16px;height:16px}
.addrow{margin-top:6px}
input.in,textarea.in{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea.in{resize:vertical;line-height:1.45}
.day{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 8px 10px}
.day header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 10px}
.day h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.num{color:var(--soft);font-weight:500}
.hoy{font-size:13px;background:var(--acc);color:#111;border-radius:999px;padding:2px 9px;font-weight:600}
.count{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day.all{margin-bottom:14px;background:var(--card)}
.day .list{gap:0}
.day .row{background:none;border:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line);padding-left:0;min-height:52px}
.day .row:last-child{border-bottom:0}
.day .ph{margin:4px 0}
.day .hint{margin:2px}
.chk{width:46px;height:46px;display:grid;place-items:center;flex:none}
.chk svg{width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);padding:3px;color:transparent;transition:background-color .2s,border-color .2s}
.chk[aria-pressed=true] svg{background:var(--grn);border-color:var(--grn);color:#111}
.chk:disabled{cursor:default;opacity:.5}
.row.off{opacity:.55}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.x svg{width:18px;height:18px}
.day .x{opacity:.55}.day .row:hover .x{opacity:1}
.loading{padding:24px 6px;color:var(--soft)}
dialog{border:0;border-radius:24px;padding:0;width:min(580px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(20,10,40,.35)}
dialog::backdrop{background:rgba(30,20,50,.45)}
.dlg{padding:18px 20px 20px;display:grid;gap:18px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:22px}
.h-in{font:600 22px/1.25 Fraunces,Georgia,serif;border:0;border-bottom:1px solid var(--line);background:none;width:100%;padding:6px 0;border-radius:0}
.lab{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--soft)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--wing);border-radius:13px;padding:3px;gap:3px}
.seg button{padding:8px 13px;border-radius:10px;font-size:15px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:15px}
.dayset{display:flex;flex-wrap:wrap;gap:6px}
.dayset button{min-width:50px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.dayset button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#111}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px;flex:none}
.up{justify-self:start;cursor:pointer}
.dh p.sub{margin:2px 0 0}
.btn.primary{background:var(--vio);border-color:var(--vio);color:var(--card)}
.btn.danger{color:var(--no)}
.df{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.files{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 10px}
.files a{flex:1;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:42px;overflow-wrap:anywhere}
.files a svg{width:22px;height:22px;color:var(--vio);flex:none}
.files img{width:42px;height:42px;object-fit:cover;border-radius:8px;flex:none}
.files .wide{width:auto;padding:0 10px;font-size:13px;color:var(--no);font-weight:600}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.up:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.kick{margin:0 0 2px;font-size:13px;color:var(--soft)}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fcol,.fsec{border-radius:18px;padding:12px 14px;background:light-dark(#f4f3f5,#232226)}
.fcol h3{margin:0 0 4px;font-size:16px}
.fcol ul{margin:0;padding:0;list-style:none}
.fcol li{padding:6px 0;border-bottom:1px solid var(--line)}
.fcol li:last-child{border-bottom:0}
.ok{background:var(--okbg)}.ok h3,.ok input{color:var(--ok)}
.mid{background:var(--midbg)}.mid h3,.mid input{color:var(--mid)}
.no{background:var(--nobg)}.no h3,.no input{color:var(--no)}
.fnote{white-space:pre-wrap;margin:0}
#dFicha{width:min(880px,calc(100vw - 20px))}
.callout{margin:0;padding:12px 16px;border-radius:16px;background:var(--accbg);white-space:pre-wrap;font-weight:500}
.callout.warn{background:var(--nobg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.card img{width:100%;aspect-ratio:350/190;object-fit:cover;display:block;background:var(--wing)}
.card figcaption{padding:10px 12px 12px;display:grid;gap:3px}
.card b{font-weight:600;display:flex;gap:8px;align-items:center}
.n{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--grn);color:#111;font-size:13px}
.cnote{font-size:13px;color:var(--mid);font-weight:600}
.cardEd img{width:140px;border-radius:10px}
.fsecs{display:grid;gap:10px}
.fsec{display:grid;gap:8px}
.fsec input.in{font-weight:600}
.link{font-size:13px;color:var(--soft);justify-self:start;padding:4px 0;text-decoration:underline}
.empty{color:var(--soft);margin:0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:light-dark(#111,#2c2c30);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.toast[hidden]{display:none}
.toast button{color:var(--acc);font-weight:600;padding:8px 10px;min-height:40px}

.hr{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;background:var(--card)}
.btn.sm svg{width:17px;height:17px;color:var(--vio)}
.btn.sm:hover{border-color:var(--vio)}
#dMenu{width:min(1180px,calc(100vw - 20px))}
#dCrono{width:min(720px,calc(100vw - 20px))}
.mwrap{overflow-x:auto}
table.mt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;font-size:14px;line-height:1.35}
.mt th{font-weight:600;font-size:13px;text-align:left;padding:6px 8px;color:var(--soft)}
.mt thead th.hoyc{color:var(--mid)}
.mt td{vertical-align:top;background:light-dark(#f6f4f5,#232226);border-radius:12px;padding:8px 10px}
.mt td.hoyc{background:var(--accbg)}
.mt th.ml{width:96px;border-radius:12px;font-size:14px}
.ml0{background:#f87c56;color:#111}.ml1{background:#D0417E;color:#fff}.ml2{background:#92b558;color:#111}.ml3{background:#1b1b1e;color:#fff}
.mt th.ml0,.mt th.ml2{color:#111}.mt th.ml1,.mt th.ml3{color:#fff}
.mt textarea{font-size:14px;padding:6px;min-height:110px}
.mdays{display:none;gap:10px}
.mday{border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.mday.hoyc{border-color:var(--acc);order:-1}
.mday h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}
.mday dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;font-size:15px;line-height:1.35}
.mday dt{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;align-self:start}
.mday dd{margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rules section{border-radius:16px;padding:12px 14px}
.rules h3{margin:0 0 6px;font-size:15px}
.rules ul{margin:0;padding-left:18px;font-size:14px}
.rules li+li{margin-top:3px}
.tl{list-style:none;margin:0;padding:0}
.tl .yr{font:600 18px/1 Fraunces,Georgia,serif;margin:18px 0 6px}
.tl .yr:first-child{margin-top:0}
.ev{display:flex;gap:10px;align-items:flex-start;border-left:2px solid var(--line);margin-left:6px;padding:7px 0 7px 18px;position:relative}
.ev .dot{position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 2px var(--card)}
.ev-prueba .dot,.tg-prueba{background:var(--mag)!important}.ev-tratamiento .dot,.tg-tratamiento{background:var(--acc)!important}
.ev-consulta .dot,.tg-consulta{background:var(--ink)!important}.ev-hito .dot,.tg-hito{background:var(--grn)!important}
.ev>div{flex:1}
.ev .when{margin:0;font-size:13px;font-weight:600;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .et{margin:1px 0 0;font-weight:600;line-height:1.3}
.ev .sub{display:block;margin-top:2px}
.ev.fut .et{color:var(--mid)}
.ev .x{width:36px;height:36px;opacity:.35}.ev:hover .x{opacity:1}
.ev .wide{width:auto;padding:0 10px;font-size:13px;color:var(--no);font-weight:600;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--soft);margin:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cadd #cText{flex:1 1 240px;width:auto}
.cadd #cDate{width:auto}
.cadd select{font:inherit;font-size:16px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#cMsg:empty{display:none}
#printMenu{display:none}
.sheet{width:297mm;height:209mm;overflow:hidden;padding:8mm 9mm 7mm;box-sizing:border-box;display:flex;flex-direction:column;gap:2.8mm;color:#111;background:#fff;font-family:Figtree,system-ui,-apple-system,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.s-h{display:flex;align-items:flex-end;justify-content:space-between;gap:6mm}
.s-b{display:flex;align-items:center;gap:4mm}
.s-b svg{width:14mm;height:12mm;flex:none}
.s-h h1{font:600 22pt/1 Fraunces,Georgia,serif;margin:0;color:#111}
.s-h p{margin:1mm 0 0;font-size:9.5pt;color:#555}
.s-r{text-align:right;font-size:9.5pt;color:#555;line-height:1.4}

 [], "intro": "Importante: no hay restricción calórica. De esta lista, come todo lo que te apetezca.\nTodas las comidas del día deben incluir grasa, proteína y la menor cantidad posible de hidratos.", "secs": [{"t": "Grasa", "c": "ok", "l": ["Aguacate", "Pescado azul: sardinas, boquerón, atún, salmón, caballa", "Aceite de oliva virgen extra, en crudo", "Mayonesa casera", "Mantequilla", "Leche entera", "Yogur o kéfir enteros"]}, {"t": "Proteína", "c": "ok", "l": ["Caldo de huesos", "Pollo, conejo, cordero y ternera", "Todo tipo de pescado, blanco y azul", "Mejillones", "Quesos", "Jamón de calidad"]}, {"t": "Hidratos", "c": "mid", "l": ["Solo los que ya llevan las hortalizas y verduras", "Priorizar todo tipo de hortalizas: aguacate, tomate, brócoli escaldado, cebolla, ajo, berenjena, zanahoria, pepino, shiitake, champiñón, apio, etc."]}, {"t": "Evitar de momento", "c": "no", "l": ["Legumbres: garbanzos, lentejas, alubias, judías verdes y cacahuetes"]}, {"t": "Líquidos", "c": "", "l": ["Agua", "Vichy", "Café", "Infusiones de todo tipo", "Caldo de huesos"]}], "warn": "Día anterior al 1er ciclo: semiayuno de 24 horas, solo agua, café y caldo de huesos.\nActualizado el 19/11: el 1er ciclo se adelanta al lunes 23 a las 12:00, así que la última comida sólida es el domingo 22 hacia las 12:00.\nDespués del ciclo, comer según esta pauta.", "note": "En los ciclos siguientes se ajustará según cómo hayan ido los anteriores.\nMenú semanal con estos alimentos: botón «Menú» de arriba."}, {"id": "f-fisica", "title": "Preparación física", "sub": "Pauta de ejercicio · ALF, 18/11/2026", "intro": "", "warn": "", "note": "", "secs": [{"t": "Semana", "c": "", "l": ["Lunes: ejercicios 1, 2 y 3, una serie de cada uno «al fallo»", "Martes: caminar", "Miércoles: ejercicios 4, 5 y 6, una serie de cada uno «al fallo»", "Jueves: caminar", "Viernes: ejercicios 7, 8 y 9, una serie de cada uno «al fallo» (el 9, 3 series de 30 s)", "Sábado: caminar", "Domingo: caminar"]}, {"t": "Indicaciones importan s": {"title": "Tratamiento y cuidados", "sub": "Cómo es, la bomba, el frío, piel y boca, cuándo ir a Urgencias y preguntas para el 9/12", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": [{"id": "f-q-trat", "title": "Cómo es el tratamiento", "sub": "Según las hojas del 23/11/2026", "intro": "6 sesiones, una cada 2 semanas (la 3.ª pasa al 28/12 por Navidad). La respuesta se valora al acabar las 6.", "warn": "", "note": "Los nombres de los fármacos y las dosis están en la hoja de administración (carpeta «02 Quimioterapia»). No se publican aquí.", "cards": [], "secs": [{"t": "En cada sesión", "c": "", "l": ["Antes, por la vena: cortisona y antináuseas (por eso esa noche cuesta dormir)", "Fármaco 1, «el del frío»: 2 horas, junto con un potenciador del fármaco 2", "Fármaco 2: unos minutos en el hospital y el resto en casa, con la bomba (46 h)", "Fármaco 3, biológico: desde la 2.ª sesión. En la 1.ª no se puso porque el port-a-cath era muy reciente: necesita que las heridas estén curadas"]}, {"t": "Antes de cada sesión", "c": "mid", "l": ["Analítica de sangre: la sesión se hace si glóbulos, plaquetas y anemia salen bien", "Muestra de orina y toma de la tensión: son el control del fármaco 3"]}, {"t": "Objetivo, según la Dra. E.D. (23/11)", "c": "ok", "l": ["Reducir el tumor para poder operar más adelante", "Controlar la enfermedad"]}]}, {"id": "f-q-bomba", "title": "En casa con la bomba", "sub": "Hoja del Hospital de Día · se retira el miércoles 25/11 a las 16:01", "intro": "", "warn": "Llama al Hospital de Día (93 731 00 07, ext. 2049) si el indicador no se ha movido en 12 horas o el globo no se ha hecho más pequeño.", "note": "Si gotea o se suelta (consejo general): cierra la pinza, lava con mucha agua la piel que se haya mojado y llama al Hospital de Día o ve a Urgencias.", "cards": [], "secs": [{"t": "Sí", "c": "ok", "l": ["Llévala en su bolsa, entre las axilas y las caderas", "Al tumbarte, a tu lado y encima del edredón", "Mira el indicador de nivel cada 12 horas: debe ir bajando", "Comprueba que el tubo no esté doblado ni la pinza cerrada"]}, {"t": "No", "c": "no", "l": ["Llevarla más alta o más baja: el líquido pasaría demasiado rápido o demasiado lento", "Colgarla de la cama o dejarla en el suelo", "Taparla con manta gruesa, manta eléctrica, almohadilla térmica o bolsa de agua caliente", "Mojar en la ducha la zona del port-a-cath, la bomba o sus tubos", "Hacerte pruebas de radiología con contraste mientras la llevas"]}, {"t": "Mientras la llevas y 48 h después (consejo general)", "c": "mid", "l": ["Orina sentado, baja la tapa y tira de la cadena dos veces", "Lávate bien las manos después", "Quien te ayude, con guantes si toca orina, heces o vómito"]}]}, {"id": "f-q-frio", "title": "El frío: 3-4 días tras cada sesión", "sub": "Hoja del hospital · la oncóloga cambió «24 h» por «3-4 días»", "intro": "Con el frío pueden aparecer calambres u hormigueo en manos y pies, una sensación rara en labios y garganta, o la impresión de que cuesta respirar o tragar. Siempre se pasa sin dejar secuelas.", "warn": "", "note": "Consejo general: tampoco toques objetos fríos sin guantes. Si el hormigueo no mejora entre sesiones, coméntalo en la visita.", "cards": [], "secs": [{"t": "Evita", "c": "no", "l": ["Bebidas frías o con hielo", "Comida recién sacada de la nevera: yogur y kéfir, a temperatura ambiente", "Cambios bruscos de temperatura y las salidas del aire acondicionado", "Quedarte delante de la nevera abierta"]}, {"t": "Haz", "c": "ok", "l": ["Abrígate antes de salir: guantes y bufanda, con el cuello y la garganta tapados", "Ve siempre bien abrigado"]}]}, {"id": "f-q-efectos", "title": "Piel, boca, diarrea y sueño", "sub": "Consejos de la oncóloga y la enfermera, 23/11/2026", "intro": "", "warn": "", "note": "", "cards": [], "secs": [{"t": "Piel", "c": "ok", "l": ["Crema hidratante cada día", "Protección solar 50 en las partes que da el sol", "Evitar el sol directo"]}, {"t": "Boca", "c": "ok", "l": ["Si salen llagas: enjuagues con infusión de tomillo y ½ cucharadita de bicarbonato", "Cepillo de dientes suave (consejo general)"]}, {"t": "Diarrea", "c": "mid", "l": ["Pastillas para la diarrea: 2 de golpe y, después, 1 cada 6 horas hasta que pare", "Suele bastar con las 2 primeras", "Bebe mucho, a sorbos (consejo general)"]}, {"t": "Sueño", "c": "", "l": ["La cortisona de la sesión quita el sueño", "Pastilla para dormir: la noche antes de la sesión y la noche de la sesión"]}, {"t": "Cada mañana", "c": "", "l": ["Cortisona: 1 comprimido, aparte de la de las sesiones, como mínimo hasta la visita del 9/12"]}]}, {"id": "f-q-urg", "title": "Cuándo llamar o ir a Urgencias", "sub": "Consejo general (Sociedad Española de Farmacia Hospitalaria) · confírmalo el 9/12", "intro": "Con fiebre de 38 °C o más, o escalofríos: llama al Hospital de Día (93 731 00 07, ext. 2049; lunes a viernes, de 9 a 15 h) o, fuera de ese horario, ve a Urgencias del hospital. Sin esperar.", "warn": "", "note": "Teléfonos con botón de llamar: ítem «Hospital de Día · contactos».", "cards": [], "secs": [{"t": "Llama o ve a Urgencias si…", "c": "no", "l": ["Fiebre de 38 °C o más, o escalofríos", "La zona del port-a-cath se pone roja, caliente, hinchada o duele", "Sangrado: heces negras, sangre en la orina, moratones sin golpe", "Vómitos o diarrea fuertes que no paran con el tratamiento", "Llagas que no te dejan comer ni beber", "Dolor de cabeza fuerte o visión borrosa", "Pérdida repentina de fuerza o de sensibilidad en un brazo o una pierna"]}, {"t": "Emergencia grave", "c": "no", "l": ["112"]}]}, {"id": "f-q-preg", "title": "Preguntas para el 9/12", "sub": "Para la Dra. E.D. y para Enfermería", "intro": "", "warn": "", "note": "Pendientes de la hoja del 23/11 y de la lista que preparaste el 21/11.", "cards": [], "secs": [{"t": "El tumor y el plan", "c": "", "l": ["Resultado del estudio genético del tumor", "¿La inmunoterapia podría ser una opción? (quedó sin responder)", "La hoja dice «máximo 12 ciclos»: ¿cuántos se prevén?", "¿Qué viene después de las 6 sesiones?", "¿Me valorará el comité de hígado (hepatobiliar)? Si responde bien, ¿cirugía u otras opciones?", "¿Hay algún ensayo clínico para mí?", "Con sinceridad, ¿qué pronóstico tengo?"]}, {"t": "Lo que hago por mi cuenta", "c": "", "l": ["¿Es seguro el semiayuno de 24 h antes de cada sesión?", "¿Algún límite a la dieta baja en azúcar y a la pérdida de peso? (la cortisona sube la glucosa)", "¿Qué ejercicio puedo hacer con el port-a-cath y la bomba?"]}, {"t": "Medicación", "c": "", "l": ["¿Sigo con la cortisona de cada mañana después del 9/12?", "¿Me puedo vacunar de la gripe?", "¿Me tomo la tensión en casa? ¿Cada cuánto?", "¿Me hicieron la prueba de la enzima DPD antes de empezar?", "Si me sale un herpes (culebrilla): hay un antiviral incompatible con mi tratamiento. ¿Qué hago y a quién aviso? (detalle en la ficha de la carpeta)"]}, {"t": "Señales de alarma", "c": "", "l": ["¿A qué teléfono llamo fuera de horario y en fin de semana?", "¿A partir de cuántas deposiciones al día voy a Urgencias?"]}]}]}, "i-q-hdia": {"title": "Hospital de Día · contactos", "sub": "Teléfonos con botón de llamar", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": [{"id": "f-q-contactos", "title": "Contactos", "sub": "Actualizado el 23/11/2026 con la tarjeta del Hospital de Día", "intro": "", "warn": "", "note": "Antes tenías apuntado el 93 700 36 00 (de 9 a 16 h); la tarjeta nueva da el 93 731 00 07.", "cards": [], "secs": [{"t": "Hospital de Día de Oncología · Enfermería", "c": "ok", "l": ["93 731 00 07, ext. 2049", "93 731 00 07, ext. 2426", "Lunes a viernes, de 9 a 15 h", "ihdiaoncologia@cst.cat", "Te atendió: Inf. S.L.A. (23/11)"]}, {"t": "Secretaría de Oncología", "c": "", "l": ["93 700 36 12", "Lunes a viernes, de 8:30 a 15 h"]}, {"t": "Cambiar o anular una cita", "c": "", "l": ["93 700 36 26"]}, {"t": "Fuera de horario", "c": "no", "l": ["Urgencias del hospital", "Emergencia grave: 112"]}]}]}, "i-q-cortisona": {"title": "Cortisona: 1 por la mañana (hasta el 9/12)", "sub": "Aparte de la de las sesiones. Como mínimo, hasta la visita del 9/12.", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": []}, "i-q-piel": {"title": "Piel: crema hidratante y protección solar 50", "sub": "Protección 50 en las partes que da el sol. Evita el sol directo.", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": []}, "i-q-ire": {"title": "Quedar con IRE para que me explique el tratamiento", "sub": "Esta semana", "freq": "una", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": []}, "i-q-bomba": {"title": "Bomba: mirar el indicador, mañana y noche", "sub": "Debe ir bajando. Si en 12 h no se ha movido, llama al Hospital de Día.", "freq": "una", "anchor": "2026-11-23", "done": null, "date": "2026-11-24", "note": "", "files": [], "fichas": [{"id": "f-q-bomba2", "title": "En casa con la bomba", "sub": "Hoja del Hospital de Día · se retira el miércoles 25/11 a las 16:01", "intro": "", "warn": "Llama al Hospital de Día (93 731 00 07, ext. 2049) si el indicador no se ha movido en 12 horas o el globo no se ha hecho más pequeño.", "note": "Si gotea o se suelta (consejo general): cierra la pinza, lava con mucha agua la piel que se haya mojado y llama al Hospital de Día o ve a Urgencias.", "cards": [], "secs": [{"t": "Sí", "c": "ok", "l": ["Llévala en su bolsa, entre las axilas y las caderas", "Al tumbarte, a tu lado y encima del edredón", "Mira el indicador de nivel cada 12 horas: debe ir bajando", "Comprueba que el tubo no esté doblado ni la pinza cerrada"]}, {"t": "No", "c": "no", "l": ["Llevarla más alta o más baja: el líquido pasaría demasiado rápido o demasiado lento", "Colgarla de la cama o dejarla en el suelo", "Taparla con manta gruesa, manta eléctrica, almohadilla térmica o bolsa de agua caliente", "Mojar en la ducha la zona del port-a-cath, la bomba o sus tubos", "Hacerte pruebas de radiología con contraste mientras la llevas"]}, {"t": "Mientras la llevas y 48 h después (consejo general)", "c": "mid", "l": ["Orina sentado, baja la tapa y tira de la cadena dos veces", "Lávate bien las manos después", "Quien te ayude, con guantes si toca orina, heces o vómito"]}]}]}, "i-q-retirar": {"title": "16:01 · Retirar la bomba", "sub": "Hospital de Día de Oncología · planta 1 · Enfermería", "freq": "una", "anchor": "2026-11-23", "done": null, "date": "2026-11-25", "note": "Desde hoy y durante 3-4 días, sigue con nada frío.", "files": [], "fichas": []}, "i-q-vispera2": {"title": "Víspera del 2.º ciclo", "sub": "Desde las 02:30, nada de comer (6 h antes de la analítica). Deja preparado el bote de orina. Al acostarte, la pastilla para dormir.", "freq": "una", "anchor": "2026-11-23", "done": null, "date": "2026-12-08", "note": "Si ALF te dice que repitas el semiayuno de 24 h, empezaría hoy a mediodía.", "files": [], "fichas": []}, "i-q-ciclo2": {"title": "2.º ciclo de quimioterapia (2 de 6)", "sub": "08:30 analítica en ayunas · 10:40 Dra. E.D. · 12:34 Hospital de Día, si la analítica sale bien", "freq": "una", "anchor": "2026-11-23", "done": null, "date": "2026-12-09", "note": "Lleva el bote de orina y las preguntas (ítem «Tratamiento y cuidados»). Pide que te tomen la tensión. Pregunta si sigues con la cortisona. Por la noche, la pastilla para dormir. Los 3-4 días siguientes, nada frío.", "files": [], "fichas": []}, "i-q-ciclo3": {"title": "3.er ciclo de quimioterapia (3 de 6) · por confirmar", "sub": "Se pasa al 28/12 para no coincidir con Navidad", "freq": "una", "anchor": "2026-11-23", "done": null, "date": "2026-12-28", "note": "", "files": [], "fichas": []}, "i-tamsu": {"title": "8:00 · Tamsulosina (próstata)", "sub": "Una al día, por la mañana. De siempre: aparte de este proceso.", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "", "files": [], "fichas": []}, "i-alimentos": {"title": "Alimentos: sí y no", "sub": "Ranking según las guías y la pauta de ALF · 24/11/2026", "freq": "semanal", "anchor": "2026-11-23", "done": null, "date": null, "note": "Complementa la pauta de ALF; no la sustituye. Lo que choque con ella, háblalo con él.", "files": [], "fichas": [{"id": "f-ali-si", "title": "Los 12 más recomendados", "sub": "Encajan con la pauta de ALF y con las guías de oncología", "intro": "Por orden de importancia en tu situación. La regla de oro: proteína en todas las comidas, para no perder músculo.", "warn": "", "note": "Fuentes: guía europea de nutrición en cáncer (ESPEN, 2021), guía de ASCO sobre ejercicio y dieta durante el tratamiento (2022), OMS-IARC (2015), Fondo Mundial para la Investigación del Cáncer (WCRF) y Sociedad Americana contra el Cáncer. Detalle y enlaces en el PDF de la carpeta «03 Nutrición».", "cards": [], "secs": [{"t": "Proteína", "c": "ok", "l": ["1. Pescado azul (sardina, caballa, salmón, boquerón cocinado): proteína y omega-3. La guía europea lo apoya en quimioterapia para sostener apetito, peso y músculo", "2. Huevos bien cuajados: proteína completa, fácil de comer y barata", "3. Pollo, pavo y conejo: proteína magra para conservar el músculo", "4. Ternera o cordero, con moderación (hasta unos 350-500 g cocinados a la semana): hierro del que mejor se absorbe, útil con la anemia", "5. Mejillones y pescado blanco, bien cocinados: proteína ligera; los mejillones aportan hierro y vitamina B12", "6. Yogur natural, kéfir y queso curado, enteros y pasteurizados: proteína y calcio. Los días del frío, a temperatura ambiente"]}, {"t": "Grasa buena", "c": "ok", "l": ["7. Aceite de oliva virgen extra, en crudo: energía de calidad sin azúcar", "8. Aguacate: grasa buena, fibra y potasio, casi sin azúcares"]}, {"t": "Hortalizas", "c": "ok", "l": ["9. Brócoli, coliflor y col, cocinados: fibra y muy pocos hidratos", "10. Espinacas, acelgas y otras hojas verdes: folatos y magnesio. Con pimiento o unas gotas de limón, su hierro se absorbe mejor", "11. Tomate, pimiento, calabacín, berenjena, pepino y setas: volumen, fibra y vitaminas con muy pocos hidratos"]}, {"t": "Líquidos", "c": "ok", "l": ["12. Agua y caldo de huesos casero: hidratación, sobre todo si hay diarrea. El caldo, casero y con poca sal"]}]}, {"id": "f-ali-no", "title": "Los 12 que conviene evitar", "sub": "Por la pauta de ALF, por el tratamiento o por seguridad", "intro": "Del 1 al 5, por la pauta y por salud; del 6 al 8, por seguridad cuando bajan las defensas; del 9 al 12, por el tratamiento.", "warn": "", "note": "Fuentes: guía europea de nutrición en cáncer (ESPEN, 2021), guía de ASCO sobre ejercicio y dieta durante el tratamiento (2022), OMS-IARC (2015), Fondo Mundial para la Investigación del Cáncer (WCRF) y Sociedad Americana contra el Cáncer. Detalle y enlaces en el PDF de la carpeta «03 Nutrición».", "cards": [], "secs": [{"t": "Por la pauta y por salud", "c": "no", "l": ["1. Azúcar, dulces, refrescos y zumos (también los naturales): picos de azúcar y nada útil a cambio", "2. Pan, pasta, arroz, patata, maíz y harinas: la pauta de ALF solo admite los hidratos de las verduras y hortalizas", "3. Legumbres, también judías verdes, guisantes, soja y cacahuetes: ALF las aparta de momento (ver «Hortalizas y legumbres»)", "4. Embutidos, salchichas, bacon y fiambres: la OMS clasifica la carne procesada como causa demostrada de cáncer colorrectal, y llevan mucha sal", "5. Alcohol: carga el hígado, deshidrata e irrita la boca y el intestino. Ninguna cantidad ayuda"]}, {"t": "Por seguridad, con las defensas bajas", "c": "no", "l": ["6. Huevo crudo o poco hecho (mayonesa casera, merengue, tiramisú): riesgo de salmonela. Mayonesa comprada o hecha con huevo pasteurizado", "7. Pescado, marisco y carne crudos o poco hechos (sushi, ostras, boquerones en vinagre, tartar, carpaccio): riesgo de infección", "8. Leche cruda y quesos de leche cruda o blandos artesanos: riesgo de listeria. Mejor quesos curados y pasteurizados"]}, {"t": "Por el tratamiento", "c": "no", "l": ["9. Nada frío los 3-4 días después de cada sesión (helado, hielo, recién sacado de la nevera): por el fármaco 1, indicación del hospital", "10. Pomelo y naranja amarga (y sus zumos y mermeladas): cambian cómo el cuerpo procesa muchos medicamentos; en oncología se suelen evitar", "11. Suplementos y «remedios naturales» sin consultar (hipérico, extractos de té verde, cúrcuma en cápsulas, vitaminas o antioxidantes a dosis altas, ácido fólico): pueden interferir con el tratamiento", "12. Sal en exceso y ultraprocesados salados (pastillas de caldo, snacks, salazones): uno de los fármacos puede subir la tensión"]}]}, {"id": "f-ali-leg", "title": "Hortalizas y legumbres", "sub": "Qué entra y qué no en la pauta de ALF", "intro": "La diferencia está en qué parte de la planta comes. Legumbre: la semilla (y a veces la vaina) de una planta leguminosa. Hortaliza: hojas, raíces, tallos, flores o frutos de otras plantas. ALF pide evitar de momento todo lo que venga de leguminosas, aunque se coma tierno o en vaina.", "warn": "Ojo con las judías verdes: muchas tablas las cuentan como hortaliza porque se come la vaina tierna, pero ALF las pone expresamente en la lista de lo que hay que evitar. En tu caso, fuera.", "note": "Truco para recordarlo: si crece dentro de una vaina, es legumbre. Por qué las aparta ALF: las legumbres secas tienen varias veces más hidratos que las hortalizas. Las judías verdes las nombra él; si tienes dudas del motivo, pregúntale.", "cards": [], "secs": [{"t": "Sí: hortalizas", "c": "ok", "l": ["Hoja: lechuga, espinacas, acelgas, rúcula, canónigos", "Flor: brócoli, coliflor, alcachofa", "Fruto: tomate, pimiento, berenjena, calabacín, pepino, aguacate", "Bulbo y tallo: cebolla, ajo, puerro, apio, espárragos", "Raíz: zanahoria, rábano", "Setas: champiñón y shiitake (no son hortalizas, pero ALF las incluye)"]}, {"t": "Con moderación (mi sugerencia)", "c": "mid", "l": ["Calabaza y remolacha: son algo más dulces; mejor en cantidades pequeñas"]}, {"t": "No: legumbres secas", "c": "no", "l": ["Garbanzos, lentejas, alubias (blancas, rojas, pintas, negras), habas y guisantes secos, altramuces"]}, {"t": "No: legumbres tiernas (parecen verdura)", "c": "no", "l": ["Judías verdes, guisantes frescos, habas tiernas, tirabeques, edamame y brotes de soja"]}, {"t": "No: derivados", "c": "no", "l": ["Cacahuete y crema de cacahuete: es una legumbre, no un fruto seco", "Soja: tofu, tempeh y bebida de soja", "Hummus y harina de garbanzo"]}, {"t": "Tampoco (no son hortalizas)", "c": "mid", "l": ["Patata y boniato: tubérculos con mucho almidón", "Maíz: es un cereal"]}]}, {"id": "f-ali-alf", "title": "Para hablar con ALF y con Oncología", "sub": "Donde las guías piden cautela", "intro": "La pauta de ALF es coherente y la sigues muy bien. Estos son los puntos en que las guías de oncología dicen algo distinto o matizan. No son para cambiar nada por tu cuenta: son para hablarlo.", "warn": "", "note": "Fuentes: guía europea de nutrición en cáncer (ESPEN, 2021), guía de ASCO sobre ejercicio y dieta durante el tratamiento (2022), OMS-IARC (2015), Fondo Mundial para la Investigación del Cáncer (WCRF) y Sociedad Americana contra el Cáncer. Detalle y enlaces en el PDF de la carpeta «03 Nutrición».", "cards": [], "secs": [{"t": "Mayonesa casera y boquerones", "c": "mid", "l": ["La pauta los incluye, pero con las defensas bajas las guías piden evitar el huevo y el pescado crudos", "Solución fácil: mayonesa comprada o con huevo pasteurizado; boquerones fritos o a la plancha, no en vinagre"]}, {"t": "Semiayuno antes de la sesión", "c": "mid", "l": ["La guía europea (ESPEN, 2021) no recomienda ayunar antes, durante ni después del tratamiento, sobre todo si se está perdiendo peso", "Hay ensayos pequeños con dietas que imitan el ayuno con resultados prometedores, pero todavía no concluyentes", "Decididlo juntos, ALF y Oncología, antes del 8/12"]}, {"t": "«Dejar al tumor sin azúcar»", "c": "mid", "l": ["El cuerpo mantiene el azúcar en sangre aunque no lo comas (lo fabrica el hígado): la dieta sola no puede dejar al tumor sin glucosa", "No hay ensayos que demuestren que una dieta cetogénica mejore la quimioterapia", "La pauta de ALF tiene sentido por otras razones: azúcar estable, mucha proteína y comida de verdad"]}, {"t": "Donde más rinde tu esfuerzo", "c": "ok", "l": ["No perder músculo: proteína en cada comida (la guía europea pide más de 1 g por kilo de peso al día, idealmente hasta 1,5 g)", "Ejercicio aeróbico y de fuerza durante el tratamiento: es lo mejor demostrado contra el cansancio y la pérdida de forma (ASCO, 2022)"]}, {"t": "Otros detalles", "c": "", "l": ["Jamón: es carne procesada. Mejor un poco de vez en cuando que a diario", "Nueces y almendras: grasa y proteína con pocos hidratos. Encajarían, pero no están en la lista: pregúntale", "Verdura cruda bien lavada: se puede. La dieta que la prohíbe no reduce las infecciones (ASCO, 2022)", "Si el peso baja más de lo previsto, díselo a ALF y a Oncología"]}]}]}}, "crono": [{"id": "c01", "k": "2024-07", "w": "Julio 2024", "t": "Detección del cáncer de colon", "n": "", "tag": "hito"}, {"id": "c02", "k": "2024-07-23", "w": "23/07/2024", "t": "RM", "n": "La que se usa de referencia en la RM de 2026", "tag": "prueba"}, {"id": "c03", "k": "2024-08", "w": "Agosto 2024", "t": "Cirugía: se extirpa el tumor con éxito", "n": "", "tag": "tratamiento"}, {"id": "c04", "k": "2024-08~", "w": "Tras la cirugía", "t": "9 meses de quimioterapia preventiva, en pastillas", "n": "", "tag": "tratamiento"}, {"id": "c05", "k": "2025", "w": "Cada 6 meses", "t": "Revisiones de control", "n": "En las últimas se ven unas lesiones en el hígado, sin darles más importancia", "tag": "consulta"}, {"id": "c06", "k": "2026-10-16", "w": "16/10/2026", "t": "TAC abdominal de control", "n": "", "tag": "prueba"}, {"id": "c07", "k": "2026-10-22", "w": "22/10/2026", "t": "Revisión con la oncóloga", "n": "Con la analítica de sangre y orina y el TAC, se ve que el cáncer ha reaparecido en el hígado", "tag": "consulta"}, {"id": "c08", "k": "2026-10-26", "w": "26/10/2026", "t": "RM hepática", "n": "Ese mismo día se pide el PET-TAC", "tag": "prueba"}, {"id": "c09", "k": "2026-11-12", "w": "12/11/2026", "t": "PET-TAC", "n": "", "tag": "prueba"}, {"id": "c10", "k": "2026-11-16", "w": "Lunes 16/11/2026 · 09:40", "t": "Diagnóstico confirmado y plan de tratamiento", "n": "Consulta de Oncología en el HUT con la Dra. E.D., que confirma el diagnóstico. No se puede operar. Plan: 6 sesiones de quimioterapia con tres fármacos. Ese día, también analítica de sangre.", "tag": "consulta"}, {"id": "c11", "k": "2026-11-16~", "w": "Semana del 16/11", "t": "Cortisona para reducir la inflamación", "n": "Desde el 23/11: 1 comprimido cada mañana, aparte de la de las sesiones, como mínimo hasta la visita del 9/12.", "tag": "tratamiento"}, {"id": "c12", "k": "2026-11-18", "w": "18/11/2026", "t": "Pautas de ALF", "n": "Alimentación, ejercicio y pesaje diario para preparar el 1er ciclo", "tag": "hito"}, {"id": "c13", "k": "2026-11-19", "w": "19/11/2026", "t": "Colocación del port-a-cath", "n": "", "tag": "tratamiento"}, {"id": "c14", "k": "2026-11-19~a", "w": "19/11/2026", "t": "El hospital adelanta la 1.ª sesión", "n": "Del martes 24 al lunes 23 a las 12:00", "tag": "consulta"}, {"id": "c15", "k": "2026-11-19~b", "w": "19/11/2026", "t": "Notas de JEAN.R", "n": "Desbloqueo, mandalas como herramienta y la quimio como muleta", "tag": "hito"}, {"id": "c16", "k": "2026-11-20", "w": "20/11/2026", "t": "Empiezo a pintar mandalas", "n": "Consejo de JEAN.R para reequilibrar consciente e inconsciente", "tag": "hito"}, {"id": "c17", "k": "2026-11-22", "w": "Domingo 22/11/2026", "t": "Semiayuno de 24 h", "n": "Última comida sólida hacia las 12:00", "tag": "tratamiento"}, {"id": "c18", "k": "2026-11-23~b", "w": "Lunes 23/11/2026 · 12:34", "t": "1.ª sesión de quimioterapia (1 de 6)", "n": "Hospital de Día. Recibo 2 de los 3 fármacos; el tercero se deja para la 2.ª sesión porque el port-a-cath es muy reciente. Vuelvo a casa con la bomba (46 h).", "tag": "tratamiento"}, {"id": "c19", "k": "2026-11-20~b", "w": "20/11/2026", "tag": "consulta", "t": "Visita al médico de cabecera (Dr. D.P.)", "n": "Me explica la estrategia que cree más probable: como el tumor no se puede extirpar, la quimio busca reducirlo al máximo y, si no se puede eliminar del todo, cronificarlo, con el port-a-cath puesto de por vida y tandas de quimio cuando haga falta para mantenerlo dormido. Hace 15 años, un cáncer metastásico daba cerca de un año de vida. Ve dudoso que haya operaciones en el futuro."}, {"id": "c20", "k": "2026-11-23~a", "w": "Lunes 23/11/2026 · 12:00", "t": "Consulta con la Dra. E.D.", "n": "Responde a mi hoja de preguntas: es el mismo cáncer de colon, extendido al hígado. Objetivo: reducir el tumor para poder operar más adelante y controlar la enfermedad. Se valorará al acabar las 6 sesiones. Marcador tumoral (CEA): normal. Estudio genético del tumor: pendiente.", "tag": "consulta"}, {"id": "c21", "k": "2026-11-23~c", "w": "23/11/2026", "t": "Pautas para casa", "n": "Cortisona cada mañana hasta el 9/12; nada frío 3-4 días; crema hidratante y protección solar 50; enjuagues si salen llagas; pastillas para la diarrea y para dormir. Nuevo contacto del Hospital de Día.", "tag": "hito"}, {"id": "c22", "k": "2026-11-24", "w": "Martes 24 y miércoles 25/11", "t": "En casa con la bomba", "n": "Mirar el indicador cada 12 h.", "tag": "tratamiento"}, {"id": "c23", "k": "2026-11-25", "w": "Miércoles 25/11/2026 · 16:01", "t": "Retirada de la bomba", "n": "Hospital de Día de Oncología · planta 1 · Enfermería. Cita confirmada por SMS.", "tag": "tratamiento"}, {"id": "c24", "k": "2026-12-09", "w": "Miércoles 9/12/2026 · 08:30", "t": "Analítica de sangre y orina", "n": "En ayunas: nada de comer 6 h antes. Lleva el bote de orina. Cita confirmada por SMS.", "tag": "prueba"}, {"id": "c25", "k": "2026-12-09~a", "w": "Miércoles 9/12/2026 · 10:40", "t": "Visita con la Dra. E.D.", "n": "Consulta de Oncología. Cita confirmada por SMS. Recuerda que te tomen la tensión.", "tag": "consulta"}, {"id": "c26", "k": "2026-12-09~b", "w": "Miércoles 9/12/2026 · 12:34", "t": "2.ª sesión de quimioterapia (2 de 6)", "n": "Hospital de Día, si la analítica sale bien. Cita confirmada por SMS.", "tag": "tratamiento"}, {"id": "c27", "k": "2026-12-28", "w": "Lunes 28/12/2026 · por confirmar", "t": "3.ª sesión de quimioterapia (3 de 6)", "n": "Se pasa a esta fecha para no coincidir con Navidad.", "tag": "tratamiento"}, {"id": "c28", "k": "2026-11-22~t", "w": "Domingo 22/11/2026 · tarde", "t": "Conversación con mosén J.M.C., párroco", "n": "Hora y media de conversación: confianza, esperanza y sobre todo convicción. Un regalo de la familia del novio de mi hija.", "tag": "hito"}], "menu": [["Café con leche entera · Jamón con tomate rallado y AOVE · Queso curado", "Crema de calabacín y puerro con mantequilla · Salmón al horno con brócoli escaldado y AOVE", "Kéfir entero · Bastones de pepino con queso", "Pechuga de pollo a la plancha · Espinacas salteadas con ajo y mantequilla"], ["Yogur entero · Aguacate con atún en aceite de oliva", "Ensalada de tomate, pepino y aguacate · Ternera a la plancha con pimientos asados", "Jamón con aguacate", "Crema de champiñón y shiitake con mantequilla · Merluza a la plancha con AOVE"], ["Caldo de huesos caliente · Queso fresco con tomate y AOVE", "Pollo al horno con berenjena, cebolla y zanahoria · AOVE", "Yogur entero · Tomates cherry con queso", "Sopa de rape con puerro y apio · Aguacate"], ["Kéfir entero · Sardinas en conserva sobre tomate y aguacate", "Mejillones al vapor · Lubina al horno con cebolla y tomate, AOVE", "Caldo de huesos caliente · Queso curado", "Hamburguesa casera de ternera, bien hecha · Setas salteadas y aguacate"], ["Café con leche entera · Rollitos de jamón y queso con pepino", "Crema de coliflor con mantequilla · Conejo al ajillo con pimiento asado", "Apio y zanahoria const BUTTER="<svg viewBox=\"0 0 68 58\" aria-hidden=\"true\"><path d=\"M32 27C24 10 12 2 5 5S0 22 8 28s17 3 24-1z\" fill=\"#D0417E\"/><path d=\"M32 31c-9-1-19 3-20 12s7 12 12 8 8-12 8-20z\" fill=\"#92b558\"/><path d=\"M27 24C21 14 13 8 9 10s-2 11 4 14 10 2 14 0z\" fill=\"#fff\" opacity=\".18\"/><g transform=\"matrix(-1 0 0 1 68 0)\"><path d=\"M32 27C24 10 12 2 5 5S0 22 8 28s17 3 24-1z\" fill=\"#f87c56\"/><path d=\"M32 31c-9-1-19 3-20 12s7 12 12 8 8-12 8-20z\" fill=\"#92b558\"/><path d=\"M27 24C21 14 13 8 9 10s-2 11 4 14 10 2 14 0z\" fill=\"#fff\" opacity=\".22\"/></g><rect x=\"32\" y=\"17\" width=\"4\" height=\"30\" rx=\"2\" fill=\"#111\"/><path d=\"M33 18c-1-6-4-10-8-12M35 18c1-6 4-10 8-12\" stroke=\"#111\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/></svg>";
const RULES_A=["Sin restricción calórica: de estos alimentos, todo lo que te apetezca.", "En cada comida: grasa + proteína + los mínimos hidratos (solo los de las verduras).", "AOVE: aceite de oliva virgen extra, en crudo.", "Sin legumbres de momento: garbanzos, lentejas, alubias, judías verdes ni cacahuetes.", "Para beber: agua, Vichy, café, infusiones y caldo de huesos.", "Día anterior a la sesión: semiayuno de 24 h (agua, café y caldo de huesos). Pautado para el 1er ciclo; en los siguientes, lo que indique ALF."];
const RULES_B=["Pescado y marisco, siempre bien cocinados: nada crudo, marinado ni ahumado (boquerones en vinagre, sushi, salmón ahumado).", "Quesos de leche pasteurizada: míralo en la etiqueta.", "Mayonesa casera con huevo pasteurizado, guardada en la nevera y del mismo día.", "Verduras crudas, bien lavadas.", "Durante 3-4 días tras cada sesión, nada frío: yogur y kéfir a temperatura ambiente, bebidas sin hielo y nada recién sacado de la nevera (indicación del hospital)."];
const REFL=[{"t": "Lo pequeño también cuenta", "s": "JEAN.R", "i": "No hace falta cambiarlo todo de golpe. Un gesto pequeño repetido cada día pesa más que un gran propósito que dura una semana. Los mandalas funcionan así: un rato corto que ordena la cabeza.", "e": "Una gota que cae siempre en el mismo sitio no hace ruido, pero acaba marcando la piedra.", "h": "Pinta un mandala, aunque sea un rato. No tiene que quedar bonito: tiene que ser tuyo."}, {"t": "Moverte le dice al cuerpo que lo necesitas", "s": "Hábitos que suman", "i": "El músculo es como un empleado: si no le das trabajo, el cuerpo cree que sobra y lo va retirando. Cuando te mueves cada día, el mensaje es el contrario: «te necesito, quédate». Y tener músculo te ayuda a aguantar mejor el tratamiento.", "e": "Una bici guardada en el trastero se oxida; la que sale cada semana sigue rodando, aunque sea vieja.", "h": "Sal a caminar. Si te da pereza, ponte solo diez minutos y decide fuera si sigues."}, {"t": "Prepararte en lugar de preocuparte", "s": "JEAN.R", "i": "Preocuparse es darle vueltas a algo que todavía no ha pasado. Ocuparse es hacer algo concreto con ello. La preocupación cansa y no cambia nada; la preparación tranquiliza porque te devuelve el control.", "e": "Antes de una sesión, en lugar de pensar «¿y si me sienta mal?», preparas la bolsa: agua, algo de abrigo, el móvil cargado y un libro.", "h": "Elige una cosa que te preocupe y conviértela en una tarea pequeña que puedas hacer hoy."}, {"t": "Muchas mentes trabajan para ti", "s": "Tu propósito", "i": "Cada medicina que te ponen es el resultado de años de investigación, de miles de pacientes que participaron en ensayos y de personas que dedicaron su carrera a mejorarla. No te entra un veneno: te entra el trabajo de mucha gente con el mismo objetivo que tú.", "e": "Es como cruzar un puente: no lo construiste tú, pero te sostiene porque muchos ingenieros lo calcularon bien.", "h": "Durante la próxima sesión, o ahora mismo un minuto, imagina a esa gente trabajando y dales las gracias en silencio."}, {"t": "La quimio es la muleta", "s": "JEAN.R", "i": "Una muleta no es un castigo ni una señal de debilidad: es lo que te permite seguir andando mientras algo se recupera. La quimio cumple esa función. No camina por ti, pero te sostiene para que avances.", "e": "Quien se rompe una pierna no se enfada con la muleta: se apoya en ella y la deja cuando ya no la necesita.", "h": "Cuando pienses en el tratamiento, cambia «me tengo que poner» por «me apoyo en»."}, {"t": "Moverte pesa más que el plato perfecto", "s": "Mayo Clinic Proceedings", "i": "Una revisión publicada este otoño en la revista de la Clínica Mayo compara los grandes estudios sobre dieta, actividad física y forma física. Su conclusión: estar en forma y moverse se asocia a vivir más, y con más peso que comer de forma impecable. Está hecha en población general, no en personas en quimioterapia, pero apunta en la misma dirección que las guías de oncología.", "e": "Un coche bien cuidado que nunca sale del garaje acaba con la batería muerta; el que rueda cada día, aunque no lleve la mejor gasolina, arranca a la primera.", "h": "Hoy, tu paseo o tus ejercicios cuentan doble. No te los saltes."}, {"t": "Lo que enseña perder", "s": "Enrique Rojas", "i": "El psiquiatra Enrique Rojas sostiene que algunas derrotas, con el tiempo, acaban siendo victorias: enseñan lo que el éxito tapa. No se trata de buscar la dificultad, sino de sacarle la lección cuando llega.", "e": "El que se ha perdido una vez en el monte es el que mejor aprende a leer el mapa.", "h": "Piensa en un tropiezo de tu vida que luego te sirvió. ¿Qué aprendiste entonces que hoy te ayuda?"}, {"t": "El ejercicio compensa; el sofá, no", "s": "Mayo Clinic Proceedings", "i": "Según esa revisión, el ejercicio amortigua los efectos de unos días de comer peor; en cambio, la mejor dieta no compensa pasar días sin moverse. La comida importa, pero el movimiento es la base.", "e": "Un mal día de menú se arregla caminando; un mal día de sofá no se arregla con una ensalada.", "h": "Si hoy comes peor o no te apetece nada, que no sea también el día que no te mueves."}, {"t": "La diferencia está en la lección", "s": "Enrique Rojas", "i": "Para Rojas, el mismo golpe hunde a una persona y hace crecer a otra. Lo que cambia es lo que cada una saca de él. No eliges el golpe; sí eliges qué haces con él.", "e": "Dos personas reciben la misma lluvia: una solo se moja; la otra, además, riega el huerto.", "h": "Escribe una cosa que esta etapa te está enseñando."}, {"t": "Doblarse sin partirse", "s": "Enrique Rojas", "i": "Rojas recuerda que «resiliencia» viene de la física: es la capacidad de un metal para doblarse sin romperse. En las personas, es poder pasarlo mal y aun así darle la vuelta. La frustración también forma parte de madurar.", "e": "El junco se dobla con el viento y vuelve a levantarse; lo que se parte es lo que no cede nada.", "h": "Si algo te frustra hoy, permítete sentirlo. Luego elige el siguiente paso pequeño."}, {"t": "La forma física también es medicina", "s": "Mayo Clinic Proceedings", "i": "La revisión pide que la sanidad hable del ejercicio tanto como de la dieta, porque la evidencia lo respalda. En tu caso ya está en el plan: fuerza cuando toque y caminar el resto de días, según la pauta de ALF.", "e": "El músculo es como una hucha: lo que ingresas ahora es lo que tendrás para gastar en las semanas duras.", "h": "Después de moverte, apunta cómo te sientes. Es tu propia evidencia."}, {"t": "La voluntad, la joya", "s": "Enrique Rojas", "i": "Rojas da más valor a una voluntad firme que al talento, y lo resume así: «La voluntad es la joya de la conducta». Voluntad no es aguantarlo todo; es volver a hacer lo que toca, un día tras otro.", "e": "Las gotas que caen siempre en el mismo sitio no tienen talento, pero acaban marcando la piedra.", "h": "Elige una sola cosa del plan de hoy y hazla, aunque cueste."}, {"t": "Sentirte útil te mantiene vivo por dentro", "s": "Hábitos que suman", "i": "Las personas necesitamos saber que hacemos falta. No hace falta salvar el mundo: basta con ser útil para alguien hoy. Ese sentimiento da energía y saca a la cabeza del bucle de la enfermedad.", "e": "Ayudar a alguien de casa con el ordenador, explicar algo que sabes hacer bien o preparar un café para otro.", "h": "Haz hoy algo pequeño que sea útil para otra persona."}, {"t": "Ocuparse sí, preocuparse no", "s": "JEAN.R", "i": "Con las personas que quieres, sobre todo con tus hijos, es fácil cargar con sus problemas como si fueran tuyos. Ocuparte es estar disponible y ayudar cuando te lo piden. Preocuparte es sufrir por adelantado por cosas que no controlas.", "e": "Si uno de tus hijos tiene una entrevista de trabajo, ocuparte es preguntarle cómo la lleva; preocuparte es pasar la noche pensando en el resultado.", "h": "Cuando notes una preocupación por alguien, pregúntate: «¿hay algo que pueda hacer ahora?». Si no lo hay, suéltala."}, {"t": "El agua, la primera de la lista", "s": "Hábitos que suman", "i": "Muchas veces el cansancio o las ganas de picar son sed disfrazada. Beber agua a lo largo del día es uno de los hábitos más sencillos y más agradecidos. No se trata de obligarte, sino de tenerla siempre a mano.", "e": "Si dejas una botella en la mesa donde pasas el rato, bebes sin pensar; si está en la cocina, te olvidas.", "h": "Deja hoy una botella de agua a la vista allí donde pases más tiempo."}, {"t": "La luz de la mañana", "s": "Hábitos que suman", "i": "La luz natural pone en hora el reloj interno: te despierta por la mañana y te ayuda a dormir por la noche. Pasar el día entre bombillas desajusta ese reloj. Unos minutos de luz de día, mejor por la mañana, bastan para notarlo.", "e": "Tomarte el café junto a la ventana abierta o dar una vuelta a la manzana antes de empezar el día.", "h": "Busca hoy diez minutos de luz de día, a ser posible por la mañana."}, {"t": "Sentirlo, no razonarlo", "s": "JEAN.R", "i": "Convencerte con argumentos no basta: la cabeza siempre encuentra un «pero». La convicción que ayuda es la que se siente, no la que se razona. Por eso se trabaja con imágenes, con el cuerpo y con calma, no con discursos.", "e": "Una canción que te emociona no la analizas nota a nota: la sientes. Con la confianza en el tratamiento pasa lo mismo.", "h": "Cierra los ojos un minuto e imagina que el tratamiento está funcionando. No lo expliques: míralo."}, {"t": "Aprender algo nuevo", "s": "Hábitos que suman", "i": "El cerebro se mantiene en forma igual que el músculo: con esfuerzo. Aprender algo, aunque sea pequeño, crea conexiones nuevas y te da la sensación de seguir avanzando, aunque el cuerpo vaya más lento.", "e": "Aprender un atajo nuevo en el ordenador, cinco palabras de otro idioma o cómo se ajusta el cambio de la bici.", "h": "Aprende hoy una cosa nueva y explícasela a alguien."}, {"t": "Conservar el asombro", "s": "Hábitos que suman", "i": "El asombro es la capacidad de sorprenderte con algo bonito o interesante. Con los años, y con los golpes, se apaga si no lo cuidas. Es un pequeño motor: te recuerda que vale la pena estar aquí.", "e": "Pararte a mirar cómo cambia el color del cielo al atardecer, en lugar de pasar de largo.", "h": "Busca hoy algo que te sorprenda y quédate mirándolo un minuto entero."}, {"t": "Soltar la mochila de piedras", "s": "Hábitos que suman", "i": "Los rencores son piedras que llevas a la espalda: pesan aunque no lo notes. Soltarlos no significa darle la razón al otro, sino dejar de pagar tú el precio. Ahora necesitas esa energía para otras cosas.", "e": "Una discusión antigua que todavía te enfada cuando la recuerdas es una piedra en la mochila.", "h": "Piensa en un rencor pequeño y decide dejarlo en el suelo. No hace falta decírselo a nadie."}, {"t": "Pedir ayuda también es fuerza", "s": "Hábitos que suman", "i": "Mucha gente que te quiere no sabe cómo ayudarte. Si se lo pides, les das una forma concreta de estar cerca. Pedir ayuda no te hace débil: hace más fuerte al equipo.", "e": "«¿Me acompañas a la sesión del lunes?» es más fácil de responder que «si necesitas algo, dímelo».", "h": "Pide hoy una ayuda concreta a alguien de confianza."}, {"t": "Un mal día no lo estropea todo", "s": "Tu propósito", "i": "Tener la actitud que quieres no significa estar bien siempre. Habrá días flojos, de cansancio o de miedo, y son normales. Un mal día no hace que el tratamiento funcione peor: solo es un mal día.", "e": "Un corredor que tiene un kilómetro malo no abandona la carrera: baja el ritmo y sigue.", "h": "Si hoy es un día flojo, permítetelo sin culparte. Mañana vuelves a empezar."}, {"t": "Respirar para frenar", "s": "JEAN.R", "i": "Cuando estás nervioso, el cuerpo acelera. Respirar despacio, soltando el aire más lento de lo que entra, es como pisar el freno: le dice al cuerpo que no hay peligro. Funciona en pocos minutos y se puede hacer en cualquier sitio.", "e": "En la sala de espera: coger aire contando hasta 4 y soltarlo contando hasta 6, cinco o seis veces seguidas.", "h": "Haz esta respiración tres veces hoy: al despertarte, a media tarde y antes de dormir."}, {"t": "No malgastar el oxígeno", "s": "JEAN.R", "i": "El oxígeno es vida, y la energía también. Cada enfado inútil, cada discusión que no lleva a nada, consume una energía que tu cuerpo necesita ahora para recuperarse. Cuidarla es elegir en qué la gastas.", "e": "Discutir con un desconocido en internet o por una plaza de aparcamiento: mucho gasto y ningún beneficio.", "h": "Hoy, antes de entrar en una discusión, pregúntate: «¿me compensa este gasto?»."}, {"t": "Retos en lugar de pantalla", "s": "Hábitos que suman", "i": "Mirar la televisión o el móvil sin rumbo entretiene, pero no alimenta. Un reto pequeño, en cambio, obliga a la cabeza a trabajar y te deja satisfecho. Cambia un rato de pantalla por un rato de reto.", "e": "Un crucigrama, un sudoku, un problema de lógica o montar algo con las manos.", "h": "Sustituye hoy media hora de pantalla por algo que te haga pensar."}, {"t": "Aportar lo que te piden, no más", "s": "JEAN.R", "i": "Cuando quieres mucho a alguien, es tentador dar más de lo que te pide: consejos, opiniones, soluciones. A veces eso pesa más de lo que ayuda. Dar lo que te piden es respetar a la otra persona y cuidar tu energía.", "e": "Si uno de tus hijos te pide que le acompañes a ver un mueble, le acompañas; no hace falta darle una charla sobre toda la casa.", "h": "Hoy, antes de dar un consejo, pregunta: «¿quieres mi opinión o prefieres que te escuche?»."}, {"t": "Celebrar lo que ya has hecho", "s": "Mente", "i": "Solemos mirar lo que falta y olvidamos lo que ya está hecho. Reconocer lo conseguido, aunque sea poco, da gasolina para seguir. Por eso en Mariposa lo marcado baja, pero se queda a la vista.", "e": "Al final del día, ver tres tareas marcadas da más ánimo que mirar las diez pendientes.", "h": "Antes de dormir, repasa tres cosas que has hecho hoy y date el mérito."}, {"t": "Comer con calma", "s": "ALF", "i": "Qué comes lo marca la pauta de ALF. Cómo lo comes depende de ti. Comer sentado, despacio y sin pantallas ayuda a disfrutar, a digerir mejor y a notar cuándo ya estás lleno.", "e": "No es lo mismo un plato comido de pie mirando el móvil que el mismo plato en la mesa, con alguien y sin prisa.", "h": "Haz hoy una comida sin pantallas y dedícale al menos veinte minutos."}, {"t": "Un número no es un juicio", "s": "ALF", "i": "Pesarte cada mañana sirve para vigilar, no para juzgarte. El número es una información para ALF, como la temperatura de un termómetro. No dice si lo estás haciendo bien o mal como persona.", "e": "Un piloto mira el combustible para saber cuándo repostar, no para sentirse culpable.", "h": "Pésate, envía el dato y sigue con tu día sin darle más vueltas."}, {"t": "Ver el tratamiento funcionando", "s": "Tu propósito", "i": "Visualizar es imaginar con detalle algo que quieres que pase. No sustituye a la medicina, pero te ayuda a ir a las sesiones tranquilo y convencido en lugar de tenso. Y la tranquilidad hace todo más llevadero.", "e": "Imaginar que la medicina recorre tu cuerpo como un equipo de limpieza que sabe exactamente dónde tiene que trabajar.", "h": "Dedica tres minutos a esta imagen, con los ojos cerrados y respirando despacio."}, {"t": "Hablar con alguien de verdad", "s": "Hábitos que suman", "i": "La soledad pesa en la salud más de lo que parece. No hace falta mucha gente: hace falta conversación de verdad. Una llamada sin prisa vale más que cien mensajes.", "e": "Llamar a un amigo para preguntarle cómo está y escucharle, en lugar de mandarle un emoji.", "h": "Llama hoy a alguien con quien hace tiempo que no hablas."}, {"t": "El verde también cura la cabeza", "s": "Hábitos que suman", "i": "Estar entre árboles, cerca del agua o con el horizonte abierto baja el nivel de alerta. Basta un rato para notar que la respiración se hace más lenta. No hace falta ir lejos: un parque también sirve.", "e": "Un paseo por un parque con árboles deja la cabeza más despejada que la misma distancia entre coches.", "h": "Si puedes, que tu paseo de hoy pase por algún sitio verde."}, {"t": "El cinismo apaga", "s": "Hábitos que suman", "i": "El cinismo es pensar que nada vale la pena y que todo saldrá mal. Parece una protección, pero apaga las ganas y la energía. Puedes ser realista sin ser cínico: ver las dificultades y seguir buscando lo bueno.", "e": "Ante una buena noticia, el cínico dice «ya veremos lo que dura»; el realista dice «me alegro, y estaré atento».", "h": "Si hoy te sorprendes pensando «esto no servirá de nada», cámbialo por «vamos a ver qué pasa»."}, {"t": "Un día cada vez", "s": "Mente", "i": "Seis sesiones y meses de tratamiento: visto entero, el camino abruma. Pero solo tienes que recorrer el trozo de hoy. Del de mañana ya te ocuparás mañana.", "e": "Quien sube a una montaña mirando solo la cima se cansa antes que quien mira dónde pone el siguiente pie.", "h": "Haz lo que toca hoy en Mariposa y no mires más allá."}, {"t": "Descansar no es rendirse", "s": "Mente", "i": "Durante el tratamiento habrá días de cansancio. Descansar esos días es parte del trabajo, no una derrota. El cuerpo está ocupado reparándose y necesita que le dejes hacerlo.", "e": "Los deportistas también entrenan el descanso: sin él, se lesionan.", "h": "Si hoy estás cansado, échate un rato sin sentirte culpable."}, {"t": "Tres gracias concretas", "s": "Mente", "i": "Agradecer no es decir «todo va bien». Es fijarte en cosas concretas que han sido buenas hoy. Cuanto más concretas, más efecto tienen: el cerebro aprende a buscar lo bueno.", "e": "No «gracias por mi familia», sino «gracias porque hoy me han llamado para preguntar cómo estaba».", "h": "Escribe tres cosas concretas por las que hoy puedes dar las gracias."}, {"t": "Tu porqué", "s": "Tu propósito", "i": "Te quedan muchas cosas por hacer y personas por las que luchar. Tenerlo presente da fuerza en los días difíciles. Un porqué claro aguanta casi cualquier cómo.", "e": "Un corredor que sabe que le esperan en la meta encuentra fuerzas en el último kilómetro.", "h": "Escribe en un papel por quién y para qué luchas, y déjalo donde lo veas cada día."}, {"t": "El mandala como espejo", "s": "JEAN.R", "i": "Al pintar un mandala no hay que pensar demasiado: los colores y el orden salen solos. Por eso es un buen espejo de cómo estás por dentro. No hay mandalas mal hechos; solo hay mandalas de días distintos.", "e": "Un día te salen colores vivos y otro todo azul. Ninguno es mejor: los dos te cuentan algo.", "h": "Pinta un rato y, al acabar, mira qué colores has elegido sin juzgarlos."}, {"t": "Formas parte de un equipo", "s": "Tu propósito", "i": "No estás solo en esto. Oncología se encarga del tratamiento, ALF de tu alimentación y tu forma física, JEAN.R de la cabeza, y tu familia del día a día. Tú eres el capitán: no tienes que hacerlo todo, sino dejar que cada uno haga su parte.", "e": "En una cordada de montaña, cada uno lleva una parte del material; nadie carga con todo.", "h": "Piensa qué parte te toca hoy a ti y deja el resto en manos de quien le toca."}, {"t": "Preguntar sin miedo", "s": "Mente", "i": "Las dudas que no preguntas se convierten en preocupaciones. A los médicos les ayuda que preguntes, porque así saben qué te inquieta. Apuntar las preguntas antes de la consulta evita que se te olviden en el momento.", "e": "Llevar en el móvil una nota con tres preguntas: qué voy a notar, qué tengo que vigilar y cuándo debo avisar.", "h": "Abre una nota y apunta las dudas que tengas para tu próxima consulta."}, {"t": "La constancia también es fuerza", "s": "ALF", "i": "Los ejercicios de ALF no buscan que te conviertas en atleta. Buscan que tu cuerpo siga recibiendo el mensaje de que el músculo hace falta. Hacerlos a menudo vale más que hacerlos perfectos.", "e": "Una serie hecha un día cansado vale más que la serie perfecta que no hiciste.", "h": "Si hoy te toca ejercicio, hazlo aunque sea con menos intensidad. Lo importante es no saltártelo."}, {"t": "Lo que te dices importa", "s": "Mente", "i": "Te pasas el día hablando contigo mismo. Si ese diálogo es duro, el ánimo baja; si es amable, sube. No se trata de engañarte, sino de hablarte como le hablarías a un buen amigo.", "e": "En lugar de «no aguanto nada», decirte «hoy me cuesta, y aun así lo estoy haciendo».", "h": "Pilla hoy una frase dura que te digas y cámbiala por otra más justa."}, {"t": "Unos minutos de silencio", "s": "JEAN.R", "i": "El ruido, las noticias y las pantallas mantienen la cabeza encendida todo el día. El silencio la deja descansar y ordenarse. No hace falta meditar: basta con estar sin hacer nada unos minutos.", "e": "Sentarte cinco minutos sin móvil ni televisión, solo mirando por la ventana.", "h": "Regálate cinco minutos de silencio total en algún momento del día."}, {"t": "Reírse también cuenta", "s": "Mente", "i": "La risa relaja el cuerpo y quita peso a los problemas, aunque sea un rato. No es frivolidad: es una forma de aguantar mejor. Rodearte de lo que te hace reír es cuidarte.", "e": "Volver a ver una comedia que te encantaba o recordar con alguien una anécdota divertida.", "h": "Busca hoy algo que te haga reír de verdad."}, {"t": "Orden fuera, orden dentro", "s": "Mente", "i": "Cuando todo parece fuera de control, ordenar algo pequeño devuelve la sensación de que puedes con las cosas. Es una victoria rápida y visible.", "e": "Ordenar un cajón, la mesa de trabajo o las fotos del móvil.", "h": "Ordena hoy un sitio pequeño, de esos que se terminan en quince minutos."}, {"t": "La frustración es una señal", "s": "JEAN.R", "i": "La frustración aparece cuando las cosas no salen como esperabas, y genera estrés. No es un fallo tuyo: es una señal de que algo necesita otro enfoque. Escucharla en lugar de pelearte con ella le quita mucha fuerza.", "e": "Si un día no puedes caminar lo que querías, la frustración te dice «ajusta el plan», no «eres un desastre».", "h": "Cuando hoy notes frustración, ponle nombre: «esto me frustra porque…». Solo nombrarla ya la calma."}, {"t": "Compartir la mesa", "s": "Hábitos que suman", "i": "Comer acompañado es mucho más que alimentarse: es conversación, risa y vínculo. Las comidas compartidas son de los momentos que más unen a las personas.", "e": "Una cena sin televisión en la que cada uno cuenta lo mejor de su día.", "h": "Comparte hoy al menos una comida con alguien, aunque sea por videollamada."}, {"t": "Leer abre ventanas", "s": "Hábitos que suman", "i": "Un buen libro te lleva a otro lugar y a otra vida durante un rato. Descansas de tu propia historia sin dejar de usar la cabeza. Y se puede hacer en cualquier sitio, también en el hospital.", "e": "Llevar un libro a la sesión convierte la espera en un rato propio.", "h": "Lee hoy diez páginas de algo que te apetezca de verdad."}, {"t": "La cultura emociona", "s": "Hábitos que suman", "i": "El teatro, la música o una exposición despiertan emociones que la rutina no toca. Emocionarse es estar vivo por dentro. Y suele ser mejor con alguien al lado.", "e": "Salir del teatro comentando la obra con quien te ha acompañado.", "h": "Mira la cartelera o escucha un disco entero que te guste, sin hacer nada más mientras suena."}, {"t": "Servir a otros", "s": "Hábitos que suman", "i": "Ayudar sin esperar nada a cambio da sentido y te saca de ti mismo. Cuando ayudas, tus problemas no desaparecen, pero dejan de ocuparlo todo.", "e": "Una tarde en un banco de alimentos o enseñar a alguien algo que tú sabes hacer.", "h": "Piensa en una forma de ayudar a otros que encaje con tu momento y apúntala."}, {"t": "Metas que te esperan", "s": "Tu propósito", "i": "Tener algo bonito por delante da dirección al esfuerzo. No hace falta que sea grande: una excursión, un viaje corto, una comida especial. El cuerpo y la cabeza empujan mejor hacia algo concreto.", "e": "Volver a subir a una montaña que te gusta cuando acabe esta etapa.", "h": "Elige una meta bonita para después del tratamiento y guarda una foto suya en el móvil."}, {"t": "Dormir bien se prepara", "s": "Hábitos que suman", "i": "El sueño no empieza al apagar la luz: empieza una hora antes. Bajar las luces, dejar las pantallas y repetir siempre los mismos gestos le dice al cuerpo que toca descansar.", "e": "Siempre la misma secuencia: infusión, lavarse los dientes, leer un rato y apagar.", "h": "Esta noche, deja el móvil fuera del dormitorio media hora antes de dormir."}, {"t": "Escuchar al cuerpo y avisar", "s": "Mente", "i": "Contar cómo te encuentras no es quejarse: es dar información al equipo que te cuida. Si notas algo que no esperabas, lo dices. Así se puede ajustar a tiempo.", "e": "Avisar a la enfermera de una molestia durante la sesión, en lugar de aguantarla callado.", "h": "Si hoy notas algo raro, apúntalo con la hora y coméntalo a quien corresponda."}, {"t": "Decir que no también es cuidarse", "s": "Mente", "i": "Ahora tu energía es limitada y valiosa. Decir que no a compromisos que no te aportan no es egoísmo: es guardarla para lo importante.", "e": "«Esta vez no voy, pero me encantará que me lo contéis» es un no amable.", "h": "Revisa tu semana y quita o aplaza un compromiso que no sea importante."}, {"t": "Lo que sí depende de ti", "s": "Mente", "i": "Hay cosas que no controlas, como la forma en que responde el tumor. Y hay cosas que sí: moverte, comer según la pauta, descansar y cómo te hablas. Poner la energía en lo segundo tranquiliza y suma.", "e": "Un marinero no controla el viento, pero sí cómo coloca las velas.", "h": "Haz dos listas: lo que no depende de ti y lo que sí. Hoy, ocúpate solo de la segunda."}, {"t": "Paciencia con el proceso", "s": "Mente", "i": "Los tratamientos van por etapas y los resultados no se ven de un día para otro. La paciencia no es esperar de brazos cruzados: es seguir haciendo tu parte mientras el tiempo trabaja.", "e": "Un agricultor no tira de las plantas para que crezcan más rápido: las riega y espera.", "h": "Hoy, cuando quieras ver resultados ya, recuerda que estás regando."}, {"t": "Trátate como a un amigo", "s": "Mente", "i": "Si un amigo pasara por lo mismo, no le exigirías perfección. Le dirías que lo está haciendo bien y que descanse. Tú mereces el mismo trato.", "e": "Si un día te saltas el paseo, no te digas «no tengo voluntad»; dite «hoy no pudo ser».", "h": "Escríbete una frase de ánimo como si se la escribieras a un amigo, y léela esta noche."}, {"t": "Pasear acompañado", "s": "Hábitos que suman", "i": "Caminar con alguien junta dos hábitos en uno: mover el cuerpo y cuidar una relación. Al lado de otra persona, el paseo se alarga sin darte cuenta y la conversación fluye mejor que sentados frente a frente.", "e": "Proponer a alguien de casa un paseo después de comer en lugar del café en el sofá.", "h": "Invita hoy a alguien a caminar contigo."}, {"t": "Recuerda lo que ya has superado", "s": "Tu propósito", "i": "No empiezas de cero. Ya pasaste una operación y un tratamiento largo, y los terminaste. Esa experiencia es tuya y te recuerda que sabes resistir.", "e": "Un montañero que ya ha subido una cumbre difícil afronta la siguiente sabiendo que puede.", "h": "Piensa en un momento difícil que superaste y en qué te ayudó entonces. Úsalo hoy."}, {"t": "Las manos ocupadas calman la cabeza", "s": "JEAN.R", "i": "Hacer algo con las manos, como pintar, arreglar o cocinar, obliga a la cabeza a estar en el presente. Mientras las manos trabajan, los pensamientos que dan vueltas se calman.", "e": "Arreglar la bici, montar un mueble o pintar un mandala.", "h": "Dedica hoy un rato a una tarea manual, sin prisa."}, {"t": "Escribir para vaciar", "s": "Mente", "i": "Lo que da vueltas en la cabeza ocupa mucho más que lo que está escrito en un papel. Escribir lo que sientes, sin corregirlo, lo ordena y le quita peso.", "e": "Tres líneas al final del día: cómo me he sentido, qué me ha ayudado y qué me ha costado.", "h": "Escribe hoy esas tres líneas. Nadie tiene que leerlas."}, {"t": "Cuidar algo vivo", "s": "Hábitos que suman", "i": "Cuidar una planta o un animal te saca de ti mismo y te da una rutina amable. Ver que algo crece, o que te espera, gracias a ti es una pequeña alegría diaria.", "e": "Regar una planta cada mañana y fijarte en las hojas nuevas.", "h": "Dedica hoy unos minutos a cuidar algo vivo: una planta, un animal o un rincón verde."}, {"t": "Una idea nueva al día", "s": "Hábitos que suman", "i": "Aprender no tiene por qué ser mucho: basta una idea nueva al día. Un dato curioso, una palabra o cómo funciona algo. Es gimnasia para el cerebro y conversación para la cena.", "e": "Descubrir por qué el cielo es azul y contarlo en la mesa.", "h": "Busca hoy una curiosidad que no supieras y compártela."}, {"t": "Mirar lejos", "s": "Hábitos que suman", "i": "Pasamos el día mirando de cerca: pantallas, papeles, el móvil. Mirar lejos, al horizonte o a una montaña, descansa la vista y también la cabeza. Abre la perspectiva, literalmente.", "e": "Asomarte a un mirador o a una ventana alta y buscar el punto más lejano que veas.", "h": "Busca hoy un sitio con vista lejana y quédate mirando un par de minutos."}, {"t": "La rutina como barandilla", "s": "Mente", "i": "En los días difíciles no tienes que decidir nada: la rutina decide por ti. Por eso Mariposa ordena tu semana. Cuando flaquean las ganas, la barandilla te sostiene.", "e": "Levantarte, pesarte, desayunar y salir a caminar: si lo haces siempre igual, también lo haces un día flojo.", "h": "Sigue hoy tu rutina aunque no tengas ganas. La barandilla está para eso."}, {"t": "Dar las gracias al cuerpo", "s": "JEAN.R", "i": "Es fácil enfadarte con un cuerpo que está enfermo. Pero ese mismo cuerpo trabaja cada día para recuperarse: respira, repara y aguanta el tratamiento. Agradecerle lo que hace cambia tu relación con él.", "e": "Al acabar un paseo, pensar «gracias, piernas, por llevarme» en lugar de «qué cansado estoy».", "h": "Antes de dormir, da las gracias a una parte de tu cuerpo por lo que ha hecho hoy."}, {"t": "Volver a empezar", "s": "Mente", "i": "Cada día es una página en blanco. Lo que no salió ayer no condiciona lo de hoy. Mañana estas reflexiones vuelven a empezar: repetirlas no es retroceder, es afianzarlas.", "e": "Un ciclista que se cae se vuelve a subir a la bici; no empieza la carrera de nuevo, la continúa.", "h": "Elige la reflexión que más te haya ayudado hasta ahora y vuelve a leerla hoy."}];
